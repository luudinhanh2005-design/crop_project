<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Không tìm thấy trang</title>
    <style>
        :root {
            --primary: #10b981;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --bg: #f8fafc;
        }
        body {
            margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg); display: flex; align-items: center; justify-content: center;
            height: 100vh; text-align: center; color: var(--text-main);
        }
        .container { max-width: 500px; padding: 20px; }
        h1 { font-size: 120px; margin: 0; color: #e2e8f0; line-height: 1; }
        h2 { font-size: 24px; margin: -20px 0 20px; font-weight: 700; }
        p { color: var(--text-sub); margin-bottom: 30px; line-height: 1.6; }
        .btn {
            display: inline-block; padding: 12px 30px; background: var(--primary);
            color: white; text-decoration: none; border-radius: 12px;
            font-weight: 600; transition: 0.3s;
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 10px 20px rgba(16, 185, 129, 0.2); }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Oops! Trang này không tồn tại</h2>
        <p>Đường dẫn bạn truy cập có thể đã bị xóa, thay đổi tên hoặc tạm thời không khả dụng. Vui lòng kiểm tra lại URL hoặc quay về trang chủ.</p>
        <a href="/" class="btn">Quay về trang chủ</a>
    </div>
</body>
</html>
